<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with generous safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Outer celebratory festive decorative circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGradient)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Inner badge container within safe zone (80% circle) -->
  <g filter="url(#shadow)">
    <!-- Traditional diamond lantern card plaque -->
    <rect x="136" y="136" width="240" height="240" rx="44" transform="rotate(45 256 256)" fill="#FFFFFF" fill-opacity="0.12" stroke="url(#goldGradient)" stroke-width="4" />
  </g>

  <!-- Central "祝" character in bold celebratory Chinese calligraphy style -->
  <text x="256" y="295" font-family="'Noto Sans TC', 'Noto Sans JP', 'PingFang TC', sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">
    祝
  </text>

  <!-- Sparkles / festive stars within safe zone -->
  <circle cx="160" cy="140" r="10" fill="url(#goldGradient)" />
  <circle cx="352" cy="140" r="14" fill="url(#goldGradient)" />
  <circle cx="140" cy="350" r="8" fill="url(#goldGradient)" />
  <circle cx="365" cy="360" r="11" fill="url(#goldGradient)" />
</svg>
